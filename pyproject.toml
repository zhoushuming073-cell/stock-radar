[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-radar"
version = "0.1.0"
description = "Broad US-equity quantitative research and screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py",
    "duckdb",
    "numpy",
    "pandas",
    "psutil>=6",
    "pyarrow",
    "pydantic>=2",
    "pluggy>=1.5,<2",
    "python-dotenv",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "exchange-calendars>=4.13,<5",
    "matplotlib>=3.9,<4",
    "mplfinance==0.12.10b0",
    "pandera[pandas]>=0.34,<0.35",
    "Pillow>=10",
]
viz = ["plotly>=5.24"]
vision = [
    "exchange-calendars>=4.13,<5",
    "matplotlib>=3.9,<4",
    "mplfinance==0.12.10b0",
    "pandera[pandas]>=0.34,<0.35",
    "Pillow>=10",
]
vision-labeling = ["label-studio>=1.23,<2", "waitress>=3,<4", "whitenoise>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"radar.vision" = ["dual_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
